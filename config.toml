# Default configuration for Hugo Material Design Blog Theme
# Optimized for performance and usability.

# Site parameters
[params]
  # Giscus comment system settings
  # Set enabled = true to enable comments
  # These are default values; can be overridden per-page in front matter
  [params.giscus]
    enabled = false
    repo = ""          # e.g., "username/repo"
    repoId = ""        # e.g., "R_kgDOSABtuA"
    category = "giscus"
    categoryId = ""    # e.g., "DIC_kwDOSABtuM4DAPv0"
    mapping = "pathname"
    strict = "0"
    reactionsEnabled = "1"
    emitMetadata = "1"
    inputPosition = "top"
    theme = "preferred_color_scheme"
    lang = "ja"
    loading = "lazy"

# Image processing settings for better performance
[imaging]
  resampleFilter = "lanczos"  # High-quality downsampling filter
  quality = 85                # Image quality (0-100)
  anchor = "smart"           # Smart cropping for thumbnails

# Minify CSS and JS for faster page load
[minify]
  disableCSS = false
  disableJS = false

# Cache settings for faster build times
[caches]
  [caches.getjson]
    dir = ":cacheDir/:project"
    maxAge = "10m"
<!DOCTYPE html>
<html
  {{ with site.LanguageCode | default site.Language.Lang }}
    lang="{{ . }}"
  {{ end }}
>
  <head>
    {{ partial "head" . }}
  </head>
  <body class="light dark">
    {{ partial "header" . }}
    <main class="main">
      {{- block "main" . }}
      {{- end }}
    </main>
    {{ partial "footer" . }}
  </body>
</html>
